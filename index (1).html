<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labstyle Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap">
<style>
:root{--bg:#EEF2FF;--grid:#d5dcf5;--ink:#1B1E4B;--card:#fff;--c1:#FF5C7A;--c2:#FFE45C;--c3:#5EE0B5;--c4:#A99CFF;--ok:#12a373;--bad:#e0344f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14163A;--grid:#22265a;--ink:#F1F0FF;--card:#1F2255;--ok:#5EE0B5;--bad:#ff7d93;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14163A;--grid:#22265a;--ink:#F1F0FF;--card:#1F2255;--ok:#5EE0B5;--bad:#ff7d93;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
main{max-width:620px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(2.2rem,9vw,3.4rem);line-height:.95;margin:8px 0 6px;font-weight:800;letter-spacing:-.03em}
h1 mark{background:var(--c2);color:#1B1E4B;padding:0 .15em;transform:rotate(-2deg);display:inline-block}
h2{font-size:1.6rem;margin:6px 0 14px;font-weight:800}
p.sub{margin:0 0 22px;font-size:1.05rem;opacity:.85}
.grid{display:grid;gap:14px}
.btn{font:inherit;color:#1B1E4B;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;display:block;width:100%}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,.step:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn b{display:block;font-size:1.3rem;font-weight:800}.btn span{font-size:.95rem;opacity:.85}
.btn .ico{font-size:1.9rem;float:right;margin-left:10px}
.back{font:inherit;background:none;border:0;color:var(--ink);cursor:pointer;font-weight:700;padding:6px 0;margin-bottom:6px;text-decoration:underline}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:2.5px solid var(--ink);background:var(--card);border-radius:99px;padding:5px 14px;font-weight:700}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:20px;margin-bottom:16px}
.q{font-size:1.35rem;font-weight:700;margin:0 0 16px;line-height:1.25}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:1.05rem;font-weight:700;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:13px 14px;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){background:var(--c2);color:#1B1E4B}
.opt.good{background:var(--c3);color:#1B1E4B}.opt.bad{background:var(--c1);color:#1B1E4B}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--ink);opacity:.85;font-size:1rem;margin-top:4px}
.go{font:inherit;font-weight:800;font-size:1.05rem;background:var(--ink);color:var(--bg);border:3px solid var(--ink);border-radius:14px;padding:12px 22px;cursor:pointer;margin-top:14px}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;font-size:1.3rem;font-weight:700;margin:6px 0 6px}
.sp{display:flex;align-items:center;gap:4px}
.st{display:flex;flex-direction:column;align-items:center;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden}
.step{font:inherit;font-weight:800;background:var(--c2);color:#1B1E4B;border:0;width:46px;height:42px;cursor:pointer;font-size:1.2rem}
.n{font-weight:800;min-width:46px;text-align:center;padding:2px 0}
.arrow{font-size:1.6rem;padding:0 4px}
sub{font-size:.65em}
.end{text-align:center}.end .big{font-size:3.2rem;font-weight:800;margin:6px 0}
.tag{font-size:.9rem;opacity:.8;margin-top:22px}

/* ---------- FIGURAS DE MOLÉCULAS ---------- */
.fig{container-type:inline-size;background:#fff;color:#1B1E4B;border:2.5px dashed #1B1E4B;border-radius:14px;padding:14px 10px;margin:0 0 16px;font-weight:700}
.fig .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:14px 22px}
.fig .row.g4{display:grid;grid-template-columns:1fr 1fr;justify-items:center;align-items:end;gap:18px 10px}
.fig .row:not(.g4){flex-wrap:nowrap}
.mol{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.g4 .mol{width:100%}
.mol svg{display:block;max-width:100%;height:auto}
.mol figcaption{font-size:.85rem;font-weight:800;text-align:center}
.rxn{display:flex;align-items:center;justify-content:center;gap:10px}
.grp{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.op{font-size:1.3rem;font-weight:800;white-space:nowrap}
.arw{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;min-width:56px;max-width:120px;text-align:center;font-size:.82rem;animation:fbin .4s .55s backwards}
.arw i{font-style:normal;font-weight:800;line-height:1.15}
.arw i.rv{background:var(--c2);padding:1px 7px;border-radius:8px;animation:pop .4s}
.arw .av{display:none}
.unk{flex:0 0 auto;width:60px;height:60px;border:3px dashed #1B1E4B;border-radius:14px;display:grid;place-items:center;font-size:2rem;font-weight:800;animation:wob 2.6s ease-in-out infinite}
.grp.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.25)}
@container (max-width:470px){
.rxn{flex-direction:column;gap:6px}
.arw{position:relative;flex-direction:row;justify-content:center;width:100%;max-width:none}
.arw .ah{display:none}.arw .av{display:block}.arw i{position:absolute;top:0;bottom:0;left:calc(50% + 16px);max-width:calc(50% - 22px);display:flex;align-items:center;text-align:left}}
.mol .b{stroke-dasharray:1;animation:draw .38s ease-out backwards;animation-delay:calc(var(--d,0ms) + var(--i)*80ms)}
.mol .lb{transform-box:fill-box;transform-origin:center;animation:lbin .3s ease-out backwards;animation-delay:calc(var(--d,0ms) + var(--i)*80ms + 180ms)}
.mol .hl{transform-box:fill-box;transform-origin:center;animation:hlin .55s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(var(--d,0ms) + 550ms)}
/* ---------- ANIMACIONES ---------- */
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes lbin{from{opacity:0;transform:scale(.4)}}
@keyframes hlin{from{opacity:0;transform:scale(.55)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-3deg)}}
@keyframes slidein{from{opacity:0;transform:translateX(var(--sx,-14px))}}
@keyframes fbin{from{opacity:0;transform:translateY(8px)}}
@keyframes bump{35%{transform:scale(1.3) rotate(-4deg)}70%{transform:scale(.94)}}
@keyframes yay{35%{transform:scale(1.05) rotate(-.6deg)}70%{transform:scale(.99)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes markin{from{transform:rotate(-16deg) scale(.4);opacity:0}}
@keyframes tada{0%{transform:scale(.3) rotate(-12deg);opacity:0}55%{transform:scale(1.2) rotate(6deg);opacity:1}75%{transform:scale(.95) rotate(-3deg)}100%{transform:none}}
#app>.card{animation:rise .45s cubic-bezier(.2,.9,.3,1.2) backwards}
h1 mark{animation:markin .75s .1s cubic-bezier(.2,.9,.3,1.5) backwards}
.grid>.btn{animation:pop .5s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(var(--n,0)*80ms + 150ms)}
.grid>.btn:nth-child(2){--n:1}.grid>.btn:nth-child(3){--n:2}.grid>.btn:nth-child(4){--n:3}.grid>.btn:nth-child(5){--n:4}
.btn .ico{transition:transform .2s}.btn:hover .ico{transform:rotate(-3deg) scale(1.06)}
.opts>.opt{animation:slidein .35s ease-out backwards;animation-delay:calc(var(--n,0)*60ms + 250ms)}
.opts>.opt:nth-child(2){--n:1}.opts>.opt:nth-child(3){--n:2}.opts>.opt:nth-child(4){--n:3}
.opt.good{animation:goodpop .5s}.opt.bad{animation:shake .4s}
.pill.bump{animation:bump .5s}
.pill.hot{background:var(--c2);color:#1B1E4B}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden;margin:-4px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--c3);border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1.1)}
.fb{animation:fbin .3s backwards}
.go{animation:pop .35s .1s backwards}
.eq.ok{animation:yay .5s}
.n.tick{animation:bump .28s}
.medal{font-size:3.6rem;line-height:1;animation:tada .9s cubic-bezier(.2,.9,.3,1.2) backwards}
.cf{position:fixed;pointer-events:none;z-index:50;border:1.5px solid #1B1E4B}
@media (max-width:430px){.hud{gap:7px}.pill{padding:4px 11px;font-size:.95rem}}
/* ---------- CASILLAS DE LA TABLA PERIÓDICA ---------- */
.opts.tiles{grid-template-columns:1fr 1fr}
.opt.tile{background:var(--tc);color:#1B1E4B;padding:8px 10px;text-align:center}
.opt.tile:hover:not(:disabled){background:var(--tc);transform:translateY(-3px)}
.opt.tile.good{background:var(--c3)}.opt.tile.bad{background:var(--c1)}
.el{display:grid;justify-items:center;align-content:center;gap:3px;line-height:1;min-height:96px;width:100%}
.el .z{justify-self:start;font-weight:800;font-size:.82rem}
.el .sy{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.el .ms{font-size:.72rem;font-weight:700;opacity:.8}
.el .nm{font-size:.88rem;font-weight:800;min-height:1em}
.el .nm.rv{animation:pop .4s}
.el.big{width:160px;min-height:160px;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);background:var(--tc);color:#1B1E4B;margin:0 auto 18px;padding:8px 12px;animation:pop .5s cubic-bezier(.2,.9,.3,1.25) backwards}
.el.big .sy{font-size:4rem}.el.big .z{font-size:1rem}.el.big .ms{font-size:.85rem}.el.big .nm{font-size:1.05rem}
/* ---------- VISOR 3D ---------- */
.f3{display:flex;justify-content:flex-end;margin-top:10px}
.b3d{font:inherit;font-weight:800;font-size:.85rem;background:#1B1E4B;color:#fff;border:2px solid #1B1E4B;border-radius:99px;padding:6px 13px;cursor:pointer;box-shadow:2px 2px 0 #FFE45C}
.b3d:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #FFE45C}
.b3d:focus-visible{outline:3px solid #1B1E4B;outline-offset:2px}
.modal .card.v3{max-width:540px;text-align:left;padding:16px}
.v3 h2{margin:0 0 10px;font-size:1.25rem;line-height:1.15}
.v3box{position:relative;width:100%;height:min(58vh,380px);border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card);touch-action:none}
.v3msg{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;text-align:center;padding:16px;z-index:2;background:var(--card)}
.v3 .chips{margin:10px 0 0;gap:6px}.v3 .chipb{padding:5px 12px;font-size:.9rem}
.v3 .hint{font-size:.85rem;opacity:.75;margin:8px 0 0}
.v3 .acts{justify-content:flex-end;margin-top:6px}.v3 .go{margin-top:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- HUD LATERAL + ANIMACIONES POR BOTÓN ---------- */
.hudbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px 14px;padding:8px 16px 10px;border-bottom:3px solid var(--ink)}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0}
.hp{position:relative;display:flex;align-items:center;gap:6px;border:3px solid var(--ink);background:var(--card);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:5px 10px;font-weight:800}
.hp.l{justify-self:start}.hp.r{justify-self:end}
.hp .lbl{display:none}
.hearts{display:flex;gap:3px;font-size:1.6rem;line-height:1}
.hr{display:inline-block}.hr.off{opacity:.4}
.hr.brk{animation:brk .65s}
.sc{display:inline-block;font-size:1.4rem}.cnt{font-size:.9rem;opacity:.75}
.fl{display:inline-block;line-height:1;transform-origin:50% 90%;font-size:calc(1.4rem + min(var(--s,0),5)*.09rem)}
.hp.r b{font-size:1.3rem}
.hp.r.hot{background:var(--c2);color:#1B1E4B}
.hp.r.hot .fl{animation:flame .5s infinite alternate}
.hp.r.fire{background:var(--c1);color:#1B1E4B}
.hp.bump,.sc.bump{animation:bump .5s}
.hudbar .bar{margin:10px 0 0}
.hudbar.shk{animation:shake .4s}
.gain{position:absolute;right:-4px;top:-14px;font-style:normal;font-weight:800;color:var(--ok);animation:gain .9s forwards;pointer-events:none}
.go{scroll-margin-bottom:20px}
.chip{display:inline-block;margin:-8px 0 18px;padding:5px 14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--c2);color:#1B1E4B;font-weight:800}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:92vw;text-align:center;background:var(--c2);color:#1B1E4B;border:3px solid var(--ink);border-radius:99px;box-shadow:4px 4px 0 var(--ink);padding:10px 20px;font-weight:800;pointer-events:none;animation:toastin .5s cubic-bezier(.2,.9,.3,1.3);transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translate(-50%,-24px)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-34px) scale(.8)}}
.tag a{color:var(--ink);font-weight:800}
.mute{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;width:48px;height:48px;padding:0;border-radius:50%;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);font-size:1.4rem;cursor:pointer;display:grid;place-items:center}
.mute:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mute:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(20,22,58,.55);animation:fbin .25s}
.modal .card{width:100%;max-width:380px;margin:0;text-align:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.25)}
.inp{font:inherit;font-size:1.2rem;font-weight:700;width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:12px;text-align:center}
.inp:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.who{margin:-10px 0 18px;font-weight:700}
.lnk{font:inherit;font-size:.9rem;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;opacity:.8;padding:4px}
.foot{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chipb{font:inherit;font-weight:700;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.chipb.on{background:var(--c2);color:#1B1E4B}
.chipb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ta{text-align:left;font-size:1rem;resize:vertical;margin-bottom:12px}
.lk{display:inline-block;text-decoration:none;text-align:center}
.rec{margin:4px 0 10px;font-weight:800}.rec.new{color:var(--ok);font-size:1.3rem;animation:tada .9s .3s backwards}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go.alt{background:var(--c3);color:#1B1E4B}
.shimg{display:block;max-width:100%;width:320px;margin:10px auto 0;border:3px solid var(--ink);border-radius:14px}
.modal .card.shr{max-height:calc(100dvh - 32px);overflow-y:auto}
.shr .shimg{width:min(220px,62%);margin:0 auto 12px}
.shr .go{margin-top:0;width:100%}
.shr .lead{margin:14px 0 8px;font-weight:800}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.app{display:flex;align-items:center;justify-content:center;font:inherit;font-weight:800;font-size:.95rem;text-decoration:none;color:#1B1E4B;background:var(--tc,#fff);border:2.5px solid var(--ink);border-radius:12px;padding:10px 8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.app:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.app:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app.wide{grid-column:1/-1}
.shr .msg{margin:12px 0 0;font-weight:700;min-height:1.2em}
.shr .msg a{color:var(--ink);font-weight:800}
.shr .row2{display:flex;gap:10px;justify-content:center;margin-top:12px}
@keyframes brk{25%{transform:scale(1.55) rotate(-14deg)}100%{transform:scale(.85)}}
@keyframes flame{to{transform:scale(1.22) rotate(7deg)}}
@keyframes gain{to{opacity:0;transform:translateY(-28px)}}
@keyframes goodpop{30%{transform:scale(1.06) rotate(-1deg)}60%{transform:scale(.98)}}
@keyframes glint{to{left:130%}}
.opt.good{position:relative;overflow:hidden}
.opt.good::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:glint .8s .15s}
.opts>.opt:nth-child(even){--sx:14px}
@media (min-width:900px){
.hud{grid-template-columns:1fr}
.hp.m{justify-self:center}
.hp.l,.hp.r{position:fixed;top:140px;z-index:15;flex-direction:column;justify-content:center;text-align:center;width:120px;padding:16px 8px;gap:8px;box-shadow:5px 5px 0 var(--ink)}
.hp.l{left:calc(50% - 310px - 150px)}.hp.r{right:calc(50% - 310px - 150px)}
.hp .lbl{display:block;font-size:.85rem;letter-spacing:.1em}
.hearts{flex-direction:column;gap:8px;font-size:2.6rem}
.fl{font-size:calc(3rem + min(var(--s,0),5)*.18rem)}
.hp.r b{font-size:2rem}}
/* entrada distinta por botón */
@keyframes bubble{from{opacity:0;transform:translateY(46px) scale(.82,1.18)}60%{transform:translateY(-6px) scale(1.04,.96)}}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateX(-90deg)}}
@keyframes flash{from{opacity:0;transform:scale(1.15);filter:brightness(2.2)}}
@keyframes sideIn{from{opacity:0;transform:translateX(70px) skewX(-8deg)}}
.grid>.btn:nth-child(1){animation-name:bubble}
.grid>.btn:nth-child(2){animation-name:flip}
.grid>.btn:nth-child(3){animation-name:flash}
.grid>.btn:nth-child(4){animation-name:sideIn}
/* icono propio al pasar el cursor */
@keyframes sway{from{transform:rotate(-4deg) scale(1.06)}to{transform:rotate(4deg) scale(1.06)}}
@keyframes spin3d{0%,100%{transform:rotateY(-14deg) scale(1.06)}50%{transform:rotateY(14deg) scale(1.06)}}
@keyframes flick{0%,100%{transform:scale(1.04);filter:brightness(1)}50%{transform:scale(1.1) rotate(-2deg);filter:brightness(1.12)}}
@keyframes spin{0%,100%{transform:rotate(-4deg) scale(1.05)}50%{transform:rotate(4deg) scale(1.05)}}
.btn:hover .ico{animation-duration:1.4s;animation-iteration-count:infinite}
.grid>.btn:nth-child(1):hover .ico{animation-name:sway;animation-direction:alternate;animation-timing-function:ease-in-out}
.grid>.btn:nth-child(2):hover .ico{animation-name:spin3d;animation-duration:2s;animation-timing-function:ease-in-out}
.grid>.btn:nth-child(3):hover .ico{animation-name:flick;animation-duration:1.6s;animation-timing-function:ease-in-out}
.grid>.btn:nth-child(4):hover .ico{animation-name:spin;animation-duration:2.4s;animation-timing-function:ease-in-out}
.btn:disabled{cursor:not-allowed}
.btn:disabled:hover{transform:none;box-shadow:5px 5px 0 var(--ink)}
.btn:disabled:hover .ico{animation:none;transform:none}

/* ---------- HOME EN PANELES ---------- */
main:has(.homewrap){max-width:860px}
.homewrap{min-height:calc(100dvh - 68px);display:flex;flex-direction:column;gap:12px}
.hh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hh h1{font-size:clamp(1.9rem,7vw,2.8rem);margin:0}

function streakModal(){
const o=LS.get('days',{last:'',n:0,b:0}),cur=dayStreak(),diff=o.last?Math.round((Date.parse(dstr(0))-Date.parse(o.last))/864e5):99;
const cells=[-6,-5,-4,-3,-2,-1,0].map(off=>{const d=new Date();d.setDate(d.getDate()+off);const on=cur>0&&off<=-diff&&off>=-diff-(cur-1);
return `<div class="dy${on?' on':''}${off===0?' td':''}"><span>${on?'🔥':'·'}</span><small>${d.toLocaleDateString(LANG,{weekday:'narrow'})}</small></div>`}).join('');
const msg=cur===0?_t('st0'):diff===0?_t('stDone'):_t('stRisk');
const m=document.createElement('div');m.className='modal';
m.innerHTML=`<div class="card"><h2>${_t('stT')}</h2><div class="sbig">🔥 ${cur}</div><p class="q" style="margin:0 0 12px">${_t('stDays',cur)}</p><div class="week">${cells}</div><p class="rec">${_t('stBest',Math.max(o.b||0,cur))}</p><p class="sub" style="margin:0 0 6px">${msg}</p><button class="go alt" id="stx">${_t('close')}</button></div>`;
document.body.appendChild(m);const x=m.querySelector('#stx');x.focus();x.onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()}}

function pickN(key,arr,n){const K='seen2:'+key,seen=LS.get(K,[]).filter(i=>i<arr.length),idx=arr.map((_,i)=>i);
let pool=shuf(idx.filter(i=>!seen.includes(i))),base=seen;
if(pool.length<n){base=[];pool=pool.concat(shuf(idx.filter(i=>!pool.includes(i))))}
const p=pool.slice(0,n);LS.set(K,base.concat(p));return p.map(i=>arr[i])}

/* ---------- MOTOR ---------- */
function play(kind,back){
PW=0;
S={score:0,streak:0,lives:3,i:0,kind,back:back||'home',title:_t('ti_'+kind),miss:[],cur:null};
if(kind==='org')S.title=ORGT[ORGKEY];S.list=kind==='org'?pickN('org-'+ORGKEY,ORG[ORGKEY],8):kind==='eq'?pickN('eq',EQ,8):kind==='nom'?pickN('nom',NOM,8):kind==='mito'?pickN('mito',MITO,8):(kind==='dat'?mkDat():fresh(kind));
next()}
function hud(){const n=S.list.length,w=Math.round(S.i/n*100);
requestAnimationFrame(()=>{const b=document.getElementById('bar');if(b){b.style.width=w+'%';PW=w}});
return `${ICON('askExit()')}<div class="hudbar"><div class="hud"><div class="hp l"><span class="lbl">${_t('lives')}</span><div class="hearts" id="p-lv" role="img" aria-label="${_t('ariaLives',S.lives)}">${hearts()}</div></div><div class="hp m"><span class="sc" id="p-sc">⭐ ${S.score}</span><span class="cnt">${S.i+1}/${n}</span></div><div class="hp r${S.streak>=3?' hot':''}${S.streak>=5?' fire':''}" id="p-st" aria-live="polite">${stk()}</div></div><div class="bar"><i id="bar" style="width:${PW}%"></i></div></div>`}
function next(){
close3D();
if(S.i>=S.list.length||S.lives<=0)return end();
const it=S.list[S.i];RV.length=0;
if(S.kind==='eq')return renderEq(it);
let q,opts,a,e='',fg=null,ex='';
if(S.kind==='nom'){q=_t('qNom',sub(it[0]));a=it[1];opts=shuf([a,...nomDis(a)]);e=`${sub(it[0])} = ${a}`+(it[0]==='H2S'?_t('h2s'):'')}
else if(S.kind==='sym'){q=_t('qSym',it[1]);a=it[0];opts=shuf([a,...shuf(EL.filter(x=>x[0]!==a)).slice(0,3).map(x=>x[0])]);e=`${cap(it[1])}: ${it[0]} (Z = ${it[2]}).`}
else if(S.kind==='name'){q=_t('qName');ex=bigtile(it);a=it[1];opts=shuf([a,...shuf(EL.filter(x=>x[1]!==a)).slice(0,3).map(x=>x[1])]);e=`${it[0]} = ${it[1]} (Z = ${it[2]}).`}
else if(S.kind==='dat'){const el=it.el;
if(it.t==='z'){q=_t('qZ',el[1]);a=String(el[2]);const o=new Set([a]);while(o.size<4){const v=el[2]+((Math.random()*9|0)-4);if(v>0&&v!==el[2])o.add(String(v))}opts=shuf([...o]);e=_t('eZ',cap(el[1]),el[0],el[2])}
else{q=_t('qFam');ex=bigtile(el,1);a=CATN[el[4]];opts=shuf([a,...shuf(Object.values(CATN).filter(x=>x!==a)).slice(0,3)]);e=`${cap(el[1])} (${el[0]}): ${a.toLowerCase()}.`}}
else if(S.kind==='org'){q=it[0];a=it[1];opts=shuf([a,...it[2]]);e=it[3];fg=it[4]}
else{q=esc(it[0]);opts=[_t('myth'),_t('fact')];a=opts[it[1]];e=it[2]}

function nomDis(a){

const ws=w(a),others=NOM.map(x=>x[1]).filter(x=>x!==a);
const near=shuf(others.filter(x=>w(x).some(t=>ws.includes(t)))),far=shuf(others.filter(x=>!near.includes(x)));

let cur=[];
function atoms(f){const st=[{}],tk=f.match(/[A-Z][a-z]?|\(|\)|\d+/g);
const add=(m,el,n)=>m[el]=(m[el]||0)+n;
for(let i=0;i<tk.length;i++){const t=tk[i],nx=/^\d+$/.test(tk[i+1]||'')?+tk[i+1]:0;
if(t==='(')st.push({});
else if(t===')'){const m=st.pop(),k=nx||1;for(const el in m)add(st[st.length-1],el,m[el]*k);if(nx)i++}
else if(!/^\d/.test(t)){add(st[st.length-1],t,nx||1);if(nx)i++}}
return st[0]}
function side(fs,cs){const s={};fs.forEach((f,i)=>{const a=atoms(f);for(const el in a)s[el]=(s[el]||0)+a[el]*cs[i]});return s}
const gcd=(a,b)=>b?gcd(b,a%b):a;
function eqCheck(it,cs){const nl=it[0].length,L=side(it[0],cs.slice(0,nl)),R=side(it[1],cs.slice(nl));
const els=[...new Set([...Object.keys(L),...Object.keys(R)])],bad=els.filter(el=>(L[el]||0)!==(R[el]||0));
return{ok:!bad.length&&cs.reduce(gcd)===1,bal:!bad.length,diff:bad.map(el=>_t('eqDiff',el,L[el]||0,R[el]||0)).join(' · ')}}
const eqStr=it=>{let k=0;const t=x=>x.map(f=>{const c=it[2][k++];return (c>1?c+' ':'')+sub(f)}).join(' + ');return t(it[0])+' → '+t(it[1])};
function renderEq(it){
cur=it[2].map(()=>1);
const sp=(f,k)=>`<div class="sp"><div class="st"><button class="step" aria-label="${_t('add')}" onclick="chg(${k},1)">+</button><div class="n" id="n${k}">1</div><button class="step" aria-label="${_t('subt')}" onclick="chg(${k},-1)">−</button></div><span>${sub(f)}</span></div>`;
let k=0;const L=it[0].map(f=>sp(f,k++)).join('<span>+</span>'),R=it[1].map(f=>sp(f,k++)).join('<span>+</span>');
S.cur={q:_t('bal'),a:eqStr(it),e:''};
$.innerHTML=hud()+`<div class="card"><p class="q">${_t('bal')}</p><div class="eq">${L}<span class="arrow">→</span>${R}</div><p style="text-align:center;opacity:.75;margin:8px 0 0">${_t('smallest')}</p><div id="fb"></div><div style="text-align:center"><button class="go" id="chk">${_t('chk')}</button></div></div>`;
document.getElementById('chk').onclick=function(){
const r=eqCheck(it,cur),ok=r.ok;this.remove();if(ok)document.querySelector('.eq').classList.add('ok');
document.querySelectorAll('.step').forEach(b=>b.disabled=true);
if(!ok)cur.forEach((_,i)=>document.getElementById('n'+i).textContent=it[2][i]);
verdict(ok,ok?'':(r.bal?_t('eqMin'):r.diff+'<br>')+_t('eqAns'))}}
function chg(i,d){cur[i]=Math.max(1,Math.min(20,cur[i]+d));const e=document.getElementById('n'+i);e.textContent=cur[i];e.classList.remove('tick');void e.offsetWidth;e.classList.add('tick')}
